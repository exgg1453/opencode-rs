[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

# Keep target/ small: the build machine is short on disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
oc-ai = { path = "crates/oc-ai" }
oc-core = { path = "crates/oc-core" }
oc-tui = { path = "crates/oc-tui" }
oc-server = { path = "crates/oc-server" }
oc-ext = { path = "crates/oc-ext" }
oc-lsp = { path = "crates/oc-lsp" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
